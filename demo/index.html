<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>4dps demo · Kevin’s Ramen photosphere</title>
    <link rel="stylesheet" href="/vendor/@photo-sphere-viewer/core/index.css" />
    <link rel="stylesheet" href="/vendor/@photo-sphere-viewer/video-plugin/index.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #000;
        --panel: #0c0b10;
        --line: rgba(255, 200, 140, 0.18);
        --text: #f4ebe3;
        --muted: #a89888;
        --accent: #ffb56b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .app {
        display: grid;
        grid-template-rows: auto auto 1fr;
        height: 100%;
        min-height: 100%;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.65rem 1rem;
        padding: 0.6rem 1rem;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        z-index: 5;
      }
      header h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 650;
      }
      header p {
        margin: 0;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin-left: auto;
        align-items: center;
      }
      .tabs .group {
        display: flex;
        gap: 0.3rem;
        padding: 0.15rem;
        border-radius: 999px;
        border: 1px solid var(--line);
      }
      .tabs button {
        border: 1px solid transparent;
        background: transparent;
        color: var(--text);
        border-radius: 999px;
        padding: 0.35rem 0.8rem;
        font-size: 0.78rem;
        cursor: pointer;
      }
      .tabs button.active {
        background: var(--accent);
        color: #1a1008;
        font-weight: 650;
      }
      .tabs .label {
        color: var(--muted);
        font-size: 0.7rem;
        padding: 0 0.25rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      #viewer {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 320px;
        background: #000;
        overflow: hidden;
      }
      #viewer canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
      #viewer.sphere-stage {
        background: #000;
      }
      /*
       * Sphere mode = INSIDE the photosphere (correct equirect math — no globe warp),
       * with a circular crop on black for Gallery-ball framing.
       * Outside-sphere texturing was wrong: it re-projects the map and warps object size.
       */
      #viewer.sphere-stage canvas {
        /* circle fills ~min dimension; black letterbox like phone Gallery */
        clip-path: circle(min(46vmin, 48%) at 50% 50%);
        touch-action: none;
      }
      #viewer canvas {
        touch-action: none;
      }
      /* phone-first */
      @media (max-width: 720px) {
        header {
          padding: 0.45rem 0.6rem;
          gap: 0.4rem;
        }
        header h1 { font-size: 0.9rem; }
        header p { display: none; }
        .tabs {
          margin-left: 0;
          width: 100%;
          justify-content: stretch;
        }
        .tabs .group { flex: 1; justify-content: center; }
        .tabs button {
          flex: 1;
          padding: 0.5rem 0.45rem;
          font-size: 0.85rem;
          min-height: 44px;
        }
        #viewer { min-height: 55vh; touch-action: none; }
        .hint {
          font-size: 0.65rem;
          max-width: calc(100vw - 24px);
          left: 8px;
          bottom: 8px;
        }
        #spin-bar {
          right: 8px;
          bottom: 8px;
          transform: scale(0.92);
          transform-origin: bottom right;
        }
      }
      @media (pointer: coarse) {
        .tabs button { min-height: 44px; }
        #viewer, #viewer canvas { touch-action: none; }
      }
      .hint {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 20;
        max-width: min(480px, 92vw);
        padding: 8px 12px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.55);
        color: #eee;
        font-size: 13px;
        line-height: 1.4;
        pointer-events: none;
      }
      .hint code {
        color: #9cf;
      }
      .err {
        padding: 2rem;
        color: #ffb4b4;
      }
      /* Spin controls — sphere (and immersive autorotate) */
      #spin-bar {
        display: none;
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 25;
        align-items: center;
        gap: 0.55rem;
        padding: 0.5rem 0.75rem;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(12, 11, 16, 0.92);
        backdrop-filter: blur(8px);
        max-width: min(420px, calc(100vw - 24px));
        pointer-events: auto;
      }
      #spin-bar.visible {
        display: flex;
        flex-wrap: wrap;
      }
      #spin-bar button#spin-toggle {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        border-radius: 999px;
        padding: 0.35rem 0.75rem;
        font-size: 0.78rem;
        cursor: pointer;
        white-space: nowrap;
      }
      #spin-bar button#spin-toggle.on {
        background: var(--accent);
        color: #1a1008;
        border-color: transparent;
        font-weight: 650;
      }
      #spin-bar .speed-wrap {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex: 1;
        min-width: 160px;
      }
      #spin-bar label {
        font-size: 0.7rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      #spin-bar input[type='range'] {
        flex: 1;
        min-width: 100px;
        accent-color: var(--accent);
      }
      #spin-bar #spin-speed-val {
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        min-width: 4.5rem;
        text-align: right;
      }
      /* Source strip: real 3js renders vs Grok Imagine dream packs */
      #source-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem 0.55rem;
        padding: 0.4rem 1rem;
        border-bottom: 1px solid var(--line);
        background: rgba(12, 11, 16, 0.96);
        z-index: 4;
      }
      #source-bar .label {
        color: var(--muted);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      #source-bar .group {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
      }
      #source-bar button {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        border-radius: 999px;
        padding: 0.3rem 0.7rem;
        font-size: 0.72rem;
        cursor: pointer;
        max-width: 14rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #source-bar button.active {
        background: var(--accent);
        color: #1a1008;
        font-weight: 650;
        border-color: transparent;
      }
      #source-bar button[data-kind='imagine'] {
        border-color: rgba(140, 180, 255, 0.35);
      }
      #source-bar button[data-kind='imagine'].active {
        background: #8cb4ff;
        color: #0a1020;
      }
      #source-bar .src-note {
        color: var(--muted);
        font-size: 0.72rem;
        flex: 1;
        min-width: 10rem;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div>
          <h1>4dps · Kevin’s Ramen &amp; Boba</h1>
          <p>3D / 4D · Sphere or Immersive · compare real 3js renders vs Grok Imagine dreams</p>
        </div>
        <div class="tabs">
          <span class="label">Dim</span>
          <div class="group" role="tablist" aria-label="Dimension">
            <button type="button" class="active" data-dim="3d" role="tab">3D</button>
            <button type="button" data-dim="4d" role="tab">4D</button>
          </div>
          <span class="label">View</span>
          <div class="group" role="tablist" aria-label="View mode">
            <button type="button" class="active" data-view="sphere" role="tab">Sphere</button>
            <button type="button" data-view="immersive" role="tab">Immersive</button>
          </div>
        </div>
      </header>
      <div id="source-bar" aria-label="Photosphere source">
        <span class="label">Source</span>
        <div class="group" id="source-tabs" role="tablist"></div>
        <span class="src-note" id="source-note">Loading sources…</span>
      </div>
      <div id="viewer" class="sphere-stage"></div>
      <div class="hint" id="hint">Loading…</div>
      <div id="spin-bar" aria-label="Sphere rotation controls">
        <button type="button" id="spin-toggle" title="Toggle auto-rotation" aria-pressed="false">Spin: Off</button>
        <div class="speed-wrap">
          <label for="spin-speed">Speed</label>
          <input
            id="spin-speed"
            type="range"
            min="0"
            max="100"
            step="1"
            value="14"
            title="Rotation speed (linear · 0.02–0.6 rpm)"
          />
          <span id="spin-speed-val">0.10 rpm</span>
        </div>
      </div>
    </div>

    <script type="module">
      import * as THREE from 'three'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
      import { Viewer } from '/vendor/@photo-sphere-viewer/core/index.module.js'
      import { AutorotatePlugin } from '/vendor/@photo-sphere-viewer/autorotate-plugin/index.module.js'
      import { EquirectangularVideoAdapter } from '/vendor/@photo-sphere-viewer/equirectangular-video-adapter/index.module.js'
      import { VideoPlugin } from '/vendor/@photo-sphere-viewer/video-plugin/index.module.js'

      /** Mutable asset paths — rewritten when Source tab changes (render vs Imagine). */
      const ASSETS = {
        still: '/assets/ramen-equirect.png',
        /** Optional hi equirect; null = skip (ladder equirect→faces, no 404). */
        stillHi: null,
        video: '/assets/ramen-equirect.mp4',
        /** PSV brand-LTR 4D video when raw equirect.mp4 is still mirrored */
        videoPsv: '/assets/ramen-equirect-psv.mp4',
        ambient: '/assets/ambient.mp3',
        faces: {
          px: '/assets/faces/px.png',
          nx: '/assets/faces/nx.png',
          py: '/assets/faces/py.png',
          ny: '/assets/faces/ny.png',
          pz: '/assets/faces/pz.png',
          nz: '/assets/faces/nz.png',
        },
      }

      /** Multi-source catalog: real 3js packs + Grok Imagine dream packs. */
      let sourcesCatalog = null
      let sourceId = 'render-hq'
      let currentSource = null

      /**
       * Sphere view = photosphere FROM THE INSIDE (same math as Immersive / PSV).
       * Outside-globe mapping warps object scale; we never do that for “3DPS”.
       * Circular CSS crop only — framing like Gallery, projection like a real photosphere.
       */
      const SPHERE = {
        // Initial look toward kiosk (−Z in our stitch)
        yaw: Math.PI,
        pitch: 0,
        // Horizontal FOV of the *viewer camera* looking out from the eye
        // (not cube capture FOV). ~70–85° feels natural; avoid fisheye.
        // minFov ~22 lets deep zoom when equirect is high-res (print 4k / face 2k).
        fov: 75,
        minFov: 22,
        maxFov: 100,
      }

      /**
       * Linear spin speed (log was too front-loaded / felt useless).
       * Range is Wallpaper-Engine idle → clearly moving, not a top-spin.
       * slider 0..100 → rpm in [RPM_MIN, RPM_MAX]
       */
      const RPM_MIN = 0.02
      const RPM_MAX = 0.6
      const RPM_DEFAULT = 0.1

      function sliderToRpm(t01) {
        const t = Math.min(1, Math.max(0, t01))
        return RPM_MIN + t * (RPM_MAX - RPM_MIN)
      }
      function rpmToSlider(rpm) {
        const r = Math.min(RPM_MAX, Math.max(RPM_MIN, rpm))
        return (100 * (r - RPM_MIN)) / (RPM_MAX - RPM_MIN)
      }
      function formatRpm(rpm) {
        if (rpm < 0.1) return rpm.toFixed(3) + ' rpm'
        return rpm.toFixed(2) + ' rpm'
      }

      /**
       * Immersive inside PSV.
       * Yaw 180° → kiosk (−Z). Pitch 0 for level horizon.
       */
      const IMMERSIVE = {
        yaw: '180deg',
        pitch: '0deg',
        sphereCorrection: { pan: 0, tilt: 0, roll: 0 },
        // No fisheye — 3DPS is about removing warp, not adding it
        fisheye: false,
        maxFov: 90,
        minFov: 22,
      }

      const el = document.getElementById('viewer')
      const hint = document.getElementById('hint')
      const spinBar = document.getElementById('spin-bar')
      const spinToggle = document.getElementById('spin-toggle')
      const spinSpeed = document.getElementById('spin-speed')
      const spinSpeedVal = document.getElementById('spin-speed-val')
      const sourceTabs = document.getElementById('source-tabs')
      const sourceNote = document.getElementById('source-note')
      const dimBtns = document.querySelectorAll('[data-dim]')
      const viewBtns = document.querySelectorAll('[data-view]')

      let dim = '3d' // 3d | 4d
      let view = 'sphere' // sphere | immersive
      let psv = null
      let gallery = null
      let ambientEl = null
      let levels = null

      // Shared spin state (persists across remounts).
      // 4D (Sphere + Immersive): default OFF — motion is in VIDEO (steam), not camera.
      // 3D Sphere / Immersive: default ON (Gallery idle drift), user can toggle.
      // Start false to avoid FOUC (Spin:On flash) before first syncSpinUi for 4d deep links.
      let spinEnabled = false
      let spinRpm = RPM_DEFAULT
      spinSpeed.value = String(Math.round(rpmToSlider(RPM_DEFAULT)))
      spinSpeedVal.textContent = formatRpm(RPM_DEFAULT)

      /** Per-mode default: any 4D mode spin OFF unless user forced this session. */
      function spinDefaultForMode() {
        if (dim === '4d') {
          // true only when user explicitly turned spin ON for 4D this session
          return window.__4dpsUserForcedSpin === true
        }
        // 3D Sphere / Immersive: respect last non-4D preference (default true)
        if (window.__4dpsSpinPrefer === false) return false
        return true
      }

      function syncSpinUi() {
        spinEnabled = spinDefaultForMode()
        spinToggle.classList.toggle('on', spinEnabled)
        spinToggle.textContent = spinEnabled ? 'Spin: On' : 'Spin: Off'
        spinToggle.setAttribute('aria-pressed', spinEnabled ? 'true' : 'false')
        spinSpeed.disabled = !spinEnabled
        spinSpeedVal.textContent = formatRpm(spinRpm)
        spinBar.classList.toggle('visible', view === 'sphere' || view === 'immersive')
      }

      function applySpinToPsv() {
        if (!psv) return
        try {
          const plugin = psv.getPlugin?.(AutorotatePlugin) || psv.getPlugin?.('autorotate')
          if (!plugin) return
          if (spinEnabled) {
            plugin.setSpeed?.(`${spinRpm.toFixed(3)}rpm`)
            plugin.start?.()
          } else {
            plugin.stop?.()
          }
        } catch {
          /* plugin API variance */
        }
      }

      spinToggle.addEventListener('click', () => {
        spinEnabled = !spinEnabled
        if (dim === '4d') {
          // Remember user choice for 4D this session (sphere + immersive)
          window.__4dpsUserForcedSpin = spinEnabled
        } else {
          window.__4dpsSpinPrefer = spinEnabled
        }
        syncSpinUi()
        applySpinToPsv()
      })
      spinSpeed.addEventListener('input', () => {
        const t = Number(spinSpeed.value) / 100
        spinRpm = sliderToRpm(t)
        spinSpeedVal.textContent = formatRpm(spinRpm)
        applySpinToPsv()
      })

      async function assetOk(url) {
        try {
          const r = await fetch(url, { method: 'HEAD' })
          return r.ok
        } catch {
          return false
        }
      }

      async function loadLevels() {
        try {
          const r = await fetch('/assets/levels.json')
          if (r.ok) levels = await r.json()
        } catch {
          levels = null
        }
      }

      /**
       * Apply a sources.json entry onto ASSETS (still/video/ambient/faces).
       * Imagine packs usually only have equirect.png; 4D falls back to still note.
       */
      function applySource(src) {
        if (!src) return
        currentSource = src
        sourceId = src.id
        if (src.still) ASSETS.still = src.still
        // Only promote stillHi when source declares a distinct URL (avoid 404 ladder)
        if (src.stillHi && src.stillHi !== src.still) ASSETS.stillHi = src.stillHi
        else ASSETS.stillHi = null
        if (src.video) {
          ASSETS.video = src.video
          ASSETS.videoPsv = src.videoPsv || src.video
        } else {
          // No 4D for this source — 4D tab will show still + note
          ASSETS.video = src.still || ASSETS.still
          ASSETS.videoPsv = ASSETS.video
        }
        if (src.ambient) ASSETS.ambient = src.ambient
        if (src.faces && typeof src.faces === 'object') {
          ASSETS.faces = { ...ASSETS.faces, ...src.faces }
        } else if (src.kind === 'render' && levels?.faces && Array.isArray(levels.faces) && levels.faces.length === 6) {
          // render-hq may omit faces key in older catalogs — wire levels faces for super-res zoom
          const names = ['px', 'nx', 'py', 'ny', 'pz', 'nz']
          ASSETS.faces = Object.fromEntries(names.map((n, i) => [n, levels.faces[i]]))
        } else if (src.kind === 'render' && levels?.facesSynced !== false) {
          // Keep default /assets/faces/* for render when levels still claim facesSynced
          ASSETS.faces = {
            px: '/assets/faces/px.png',
            nx: '/assets/faces/nx.png',
            py: '/assets/faces/py.png',
            ny: '/assets/faces/ny.png',
            pz: '/assets/faces/pz.png',
            nz: '/assets/faces/nz.png',
          }
        } else {
          // Imagine / still-only — clear so facesAvailable stays false
          ASSETS.faces = {
            px: '',
            nx: '',
            py: '',
            ny: '',
            pz: '',
            nz: '',
          }
        }
        // stillHi only when source provides it (don't 404 on dream packs)
        if (!src.stillHi) ASSETS.stillHi = ''
        if (src.defaultYaw) {
          IMMERSIVE.yaw =
            typeof src.defaultYaw === 'number'
              ? `${src.defaultYaw}deg`
              : String(src.defaultYaw)
          const rad = parseFloat(String(src.defaultYaw)) * (Math.PI / 180)
          if (Number.isFinite(rad)) SPHERE.yaw = rad
          else if (String(src.defaultYaw).includes('180')) SPHERE.yaw = Math.PI
        }
      }

      function renderSourceTabs() {
        if (!sourceTabs) return
        sourceTabs.innerHTML = ''
        const list = sourcesCatalog?.sources || []
        if (!list.length) {
          if (sourceNote) sourceNote.textContent = 'No sources.json — using default render assets'
          return
        }
        for (const s of list) {
          const b = document.createElement('button')
          b.type = 'button'
          b.dataset.source = s.id
          b.dataset.kind = s.kind || 'render'
          b.role = 'tab'
          b.textContent = s.label || s.id
          b.title = s.prompt || s.note || s.id
          b.classList.toggle('active', s.id === sourceId)
          b.addEventListener('click', () => {
            if (s.id === sourceId) return
            applySource(s)
            renderSourceTabs()
            updateSourceNote()
            mount()
          })
          sourceTabs.appendChild(b)
        }
        updateSourceNote()
      }

      function updateSourceNote() {
        if (!sourceNote || !currentSource) return
        const kind = currentSource.kind === 'imagine' ? 'Imagine dream' : '3js render'
        const hasVid = currentSource.video ? ' · 4D video' : ' · 3D still only'
        sourceNote.textContent = `${kind}: ${currentSource.label || currentSource.id}${hasVid}`
      }

      async function loadSources() {
        try {
          const r = await fetch('/assets/sources.json')
          if (r.ok) sourcesCatalog = await r.json()
        } catch {
          sourcesCatalog = null
        }
        const list = sourcesCatalog?.sources || []
        const prefer =
          list.find((s) => s.id === sourcesCatalog?.default) ||
          list.find((s) => s.kind === 'render') ||
          list[0]
        if (prefer) applySource(prefer)
        else {
          // Fallback single render path (legacy root assets)
          currentSource = {
            id: 'render-legacy',
            label: 'Render · default',
            kind: 'render',
            still: ASSETS.still,
            video: ASSETS.video,
          }
          sourceId = currentSource.id
        }
        renderSourceTabs()
      }

      function stopAmbient() {
        if (!ambientEl) return
        try {
          ambientEl.pause()
          ambientEl.src = ''
        } catch {
          /* ignore */
        }
        ambientEl = null
      }

      async function playAmbient(url) {
        stopAmbient()
        if (!url || !(await assetOk(url))) return
        ambientEl = new Audio(url)
        ambientEl.loop = true
        ambientEl.volume = 0.42
        try {
          await ambientEl.play()
        } catch {
          const once = () => {
            ambientEl?.play().catch(() => {})
            window.removeEventListener('pointerdown', once)
          }
          window.addEventListener('pointerdown', once, { once: true })
        }
      }

      function loadTexture(url, renderer, { sharp = false, flipY = true } = {}) {
        return new Promise((resolve, reject) => {
          new THREE.TextureLoader().load(
            url,
            (t) => {
              t.colorSpace = THREE.SRGBColorSpace
              t.flipY = flipY
              t.anisotropy = renderer.capabilities.getMaxAnisotropy()
              // Mips blur when zoomed; keep mips only for wide FOV / overview
              if (sharp) {
                t.generateMipmaps = false
                t.minFilter = THREE.LinearFilter
              } else {
                t.generateMipmaps = true
                t.minFilter = THREE.LinearMipmapLinearFilter
              }
              t.magFilter = THREE.LinearFilter
              t.needsUpdate = true
              resolve(t)
            },
            undefined,
            () => reject(new Error('tex ' + url)),
          )
        })
      }

      /** When user zooms in (low FOV), disable mips so texels stay crisp. */
      function setTextureZoomSharp(tex, sharp) {
        if (!tex) return
        if (sharp) {
          tex.generateMipmaps = false
          tex.minFilter = THREE.LinearFilter
        } else {
          tex.generateMipmaps = true
          tex.minFilter = THREE.LinearMipmapLinearFilter
          tex.needsUpdate = true
        }
        tex.needsUpdate = true
      }

      /** Flip equirect on a canvas (PSV / Three don't share one mirror API). */
      function flipImageUrl(url, { flipX = false, flipY = false } = {}) {
        return new Promise((resolve, reject) => {
          const img = new Image()
          img.crossOrigin = 'anonymous'
          img.onload = () => {
            const c = document.createElement('canvas')
            c.width = img.naturalWidth || img.width
            c.height = img.naturalHeight || img.height
            const ctx = c.getContext('2d')
            ctx.translate(flipX ? c.width : 0, flipY ? c.height : 0)
            ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1)
            ctx.drawImage(img, 0, 0)
            resolve(c.toDataURL('image/png'))
          }
          img.onerror = () => reject(new Error('flip load failed: ' + url))
          img.src = url
        })
      }

      /**
       * Runtime H-flip for 4D video so PSV brand LTR matches still flipX.
       * Returns HTMLVideoElement fed by canvas.captureStream (audio via ambient bed).
       * Survives host re-sync of equirect.mp4 (no permanent asset hflip required).
       */
      async function flipVideoForPsv(url) {
        const src = document.createElement('video')
        src.crossOrigin = 'anonymous'
        src.loop = true
        src.muted = true // autoplay policy; ambient bed carries sound
        src.playsInline = true
        src.setAttribute('playsinline', '')
        src.src = url
        await new Promise((resolve, reject) => {
          src.onloadeddata = () => resolve()
          src.onerror = () => reject(new Error('video load failed: ' + url))
        })
        try {
          await src.play()
        } catch {
          /* autoplay may need gesture; still produce stream frames once playing */
        }
        const w = src.videoWidth || 2048
        const h = src.videoHeight || 1024
        const canvas = document.createElement('canvas')
        canvas.width = w
        canvas.height = h
        const ctx = canvas.getContext('2d', { alpha: false })
        let raf = 0
        const draw = () => {
          raf = requestAnimationFrame(draw)
          if (src.readyState < 2) return
          ctx.save()
          ctx.translate(w, 0)
          ctx.scale(-1, 1)
          ctx.drawImage(src, 0, 0, w, h)
          ctx.restore()
        }
        draw()
        const stream = canvas.captureStream(12)
        const out = document.createElement('video')
        out.srcObject = stream
        out.muted = true
        out.loop = true
        out.playsInline = true
        out.setAttribute('playsinline', '')
        try {
          await out.play()
        } catch {
          /* ignore */
        }
        // Keep refs so GC does not kill the pipeline; dispose via clearViewer
        out.__4dpsFlip = { src, canvas, raf, stop() {
          cancelAnimationFrame(raf)
          try { src.pause(); src.src = ''; src.load() } catch { /* */ }
          try { stream.getTracks().forEach((t) => t.stop()) } catch { /* */ }
        } }
        return out
      }

      function disposeGallery() {
        if (!gallery) return
        cancelAnimationFrame(gallery.anim)
        gallery.renderer?.domElement?.removeEventListener('pointerdown', gallery.onDown)
        window.removeEventListener('pointerup', gallery.onUp)
        try {
          gallery.disposeExtra?.()
        } catch {
          /* ignore */
        }
        gallery.controls?.dispose()
        gallery.mesh?.geometry?.dispose()
        const mat = gallery.mesh?.material
        if (mat) {
          if (mat.map) mat.map.dispose()
          if (mat.uniforms) {
            for (const k of Object.keys(mat.uniforms)) {
              mat.uniforms[k].value?.dispose?.()
            }
          }
          mat.dispose()
        }
        gallery.renderer?.dispose()
        gallery.ro?.disconnect()
        gallery = null
      }

      function disposePsv() {
        if (!psv) return
        try {
          // Stop runtime flip pipeline if attached to video panorama
          try {
            const v = psv?.getPanorama?.() || null
            // best-effort: stop any __4dpsFlip on tracked video
            if (window.__4dpsFlipVideo?.__4dpsFlip) {
              window.__4dpsFlipVideo.__4dpsFlip.stop()
              window.__4dpsFlipVideo = null
            }
          } catch { /* ignore */ }
          psv.destroy()
        } catch {
          /* ignore */
        }
        psv = null
      }

      function clearViewer() {
        disposeGallery()
        disposePsv()
        stopAmbient()
        el.innerHTML = ''
        el.classList.toggle('sphere-stage', view === 'sphere')
        if (window.__4dpsDemo) window.__4dpsDemo.ready = false
      }

      function setChrome() {
        dimBtns.forEach((b) => b.classList.toggle('active', b.dataset.dim === dim))
        viewBtns.forEach((b) => b.classList.toggle('active', b.dataset.view === view))
      }

      /**
       * Cube faces DEFAULT ON when synced (H8 sharp zoom).
       * Opt out: ?faces=0|off|false. Force on: ?faces=1|on|true.
       * Imagine never uses faces. levels.facesSynced===false quarantines.
       */
      async function facesAvailable() {
        if (currentSource?.kind === 'imagine') return false
        const facesQ = new URLSearchParams(location.search).get('faces')
        if (facesQ === '0' || facesQ === 'off' || facesQ === 'false') return false
        const forceOn = facesQ === '1' || facesQ === 'on' || facesQ === 'true'
        if (levels && levels.facesSynced === false && !forceOn) return false
        if (currentSource?.faces && typeof currentSource.faces === 'object') {
          const urls = Object.values(currentSource.faces)
          if (urls.length < 6) return false
          const ok = await Promise.all(urls.map((u) => assetOk(u)))
          return ok.every(Boolean)
        }
        if (levels?.faces && Array.isArray(levels.faces) && levels.faces.length === 6) {
          const ok = await Promise.all(levels.faces.map((u) => assetOk(u)))
          return ok.every(Boolean)
        }
        const names = ['px', 'nx', 'py', 'ny', 'pz', 'nz']
        const urls = names.map((n) => ASSETS.faces[n]).filter(Boolean)
        if (urls.length < 6) return false
        return (await Promise.all(urls.map((u) => assetOk(u)))).every(Boolean)
      }


      function livingMeta() {
        const claim = levels?.livingClaim === true
        const status =
          levels?.livingStatus ||
          levels?.inventory?.livingStatus ||
          (claim ? 'living' : 'unknown')
        const roiMad =
          levels?.roiMad ??
          levels?.roiMadMax ??
          levels?.inventory?.roiMad ??
          levels?.inventory?.roiMadMax ??
          null
        return { claim, status, roiMad }
      }

      /** Optional hi equirect only when present and distinct (no 404 ladder). */
      async function stillHiUrl() {
        const hi = ASSETS.stillHi
        if (!hi || hi === ASSETS.still) return null
        if (await assetOk(hi)) return hi
        return null
      }

      /**
       * Cube-face material — UV must match host CAPTURE lookAt orientation
       * (ShopCanvas CUBE_FACES), NOT equirect-stitch nz U-flip.
       * Stitch flips nz U only so equirect neon is LTR; direct face view uses
       * capture-native U (image left = camera left). Brand LTR on −Z kiosk.
       *   px: u= +z  v= −y | nx: u= −z  v= −y
       *   py: u= −x  v= +z | ny: u= −x  v= −z
       *   pz: u= −x  v= −y | nz: u= +x  v= −y  (capture-native; not stitch −x)
       */
      function makeCubeFaceMaterial(faceTex, { inside = false } = {}) {
        return new THREE.ShaderMaterial({
          side: inside ? THREE.BackSide : THREE.FrontSide,
          uniforms: {
            mapPx: { value: faceTex.px },
            mapNx: { value: faceTex.nx },
            mapPy: { value: faceTex.py },
            mapNy: { value: faceTex.ny },
            mapPz: { value: faceTex.pz },
            mapNz: { value: faceTex.nz },
            // Outside equirect ball uses mesh.scale.x = -1; flip dir.x so faces match
            flipX: { value: inside ? 0.0 : 1.0 },
          },
          vertexShader: `
            varying vec3 vDir;
            void main() {
              vec4 w = modelMatrix * vec4(position, 0.0);
              vDir = normalize(w.xyz);
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D mapPx, mapNx, mapPy, mapNy, mapPz, mapNz;
            uniform float flipX;
            varying vec3 vDir;
            // Capture-native cube UVs (WebGL Y-up lookAt faces). nz uses +dx
            // (image right = +X). Equirect stitch uses −dx for LTR — do not copy here.
            void main() {
              vec3 d = normalize(vDir);
              if (flipX > 0.5) d.x = -d.x;
              vec3 a = abs(d);
              vec4 c;
              if (a.x >= a.y && a.x >= a.z) {
                if (d.x > 0.0) {
                  // +X: right=+Z, up=+Y → u=dz, v=-dy
                  vec2 uv = vec2(d.z / a.x, -d.y / a.x) * 0.5 + 0.5;
                  c = texture2D(mapPx, uv);
                } else {
                  // −X: right=−Z, up=+Y → u=-dz, v=-dy
                  vec2 uv = vec2(-d.z / a.x, -d.y / a.x) * 0.5 + 0.5;
                  c = texture2D(mapNx, uv);
                }
              } else if (a.y >= a.x && a.y >= a.z) {
                if (d.y > 0.0) {
                  // +Y: right=−X, up=−Z → u=-dx, v=dz
                  vec2 uv = vec2(-d.x / a.y, d.z / a.y) * 0.5 + 0.5;
                  c = texture2D(mapPy, uv);
                } else {
                  // −Y: right=−X, up=+Z → u=-dx, v=-dz
                  vec2 uv = vec2(-d.x / a.y, -d.z / a.y) * 0.5 + 0.5;
                  c = texture2D(mapNy, uv);
                }
              } else {
                if (d.z > 0.0) {
                  // +Z: right=−X, up=+Y → u=-dx, v=-dy
                  vec2 uv = vec2(-d.x / a.z, -d.y / a.z) * 0.5 + 0.5;
                  c = texture2D(mapPz, uv);
                } else {
                  // −Z kiosk capture-native LTR: u=+dx, v=-dy
                  vec2 uv = vec2(d.x / a.z, -d.y / a.z) * 0.5 + 0.5;
                  c = texture2D(mapNz, uv);
                }
              }
              gl_FragColor = c;
            }
          `,
        })
      }

      async function loadFaceTextures(renderer) {
        const names = ['px', 'nx', 'py', 'ny', 'pz', 'nz']
        const faceTex = {}
        for (const n of names) {
          // Capture PNG v=0 top; custom dir UV — no Three flipY.
          // H-flip at load: inside-sphere projection mirrors brand vs nz capture LTR.
          const url = await flipImageUrl(ASSETS.faces[n], { flipX: true, flipY: false })
          faceTex[n] = await loadTexture(url, renderer, { flipY: false })
        }
        return faceTex
      }

      /**
       * Sphere mode — INSIDE photosphere (correct 3DPS math).
       *
       * Eye FIXED at origin. One texture for the whole session. Zoom = FOV only.
       * NEVER swap equirect ↔ cube mid-zoom — that re-maps directions (tree → stars).
       * Super-res = capture a higher-res equirect (or always-on face sphere), not a ladder.
       * Circular CSS clip = Gallery framing only.
       */
      async function mountSphere(mediaUrl, { isVideo = false } = {}) {
        clearViewer()
        el.classList.add('sphere-stage')

        // Ladder: native faces (when synced) → optional stillHi → base equirect.
        // One source for whole session — no mid-zoom swap. Zoom = FOV only.
        const useFaces = !isVideo && (await facesAvailable())
        const hiUrl = !isVideo && !useFaces ? await stillHiUrl() : null
        const stillUrl = hiUrl
          ? hiUrl
          : (await assetOk(ASSETS.still))
            ? ASSETS.still
            : mediaUrl
        let zoomPath = useFaces ? 'faces' : hiUrl ? 'hi-equirect' : 'equirect'

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false })
        const basePr = Math.min(window.devicePixelRatio || 1, 2)
        renderer.setPixelRatio(basePr)
        renderer.setClearColor(0x000000, 1)
        renderer.outputColorSpace = THREE.SRGBColorSpace
        el.appendChild(renderer.domElement)

        const scene = new THREE.Scene()
        scene.background = new THREE.Color(0x000000)

        let fov = SPHERE.fov
        const camera = new THREE.PerspectiveCamera(fov, 1, 0.05, 2000)
        // Fixed eye — never translate. Photosphere look = rotate + FOV only.
        camera.position.set(0, 0, 0)
        camera.up.set(0, 1, 0)
        camera.rotation.order = 'YXZ'

        let tex = null
        let mesh
        if (useFaces) {
          // Inside cube-face sphere — same inside convention as equirect:
          // FrontSide + scale.x=-1 (BackSide alone mirrors L/R brand).
          const faceTex = await loadFaceTextures(renderer)
          const mat = makeCubeFaceMaterial(faceTex, { inside: false })
          // flipX=1 matches scale.x=-1 (shader un-mirrors sample dir)
          mat.uniforms.flipX.value = 1.0
          const geo = new THREE.SphereGeometry(500, 96, 72)
          geo.scale(-1, 1, 1)
          mesh = new THREE.Mesh(geo, mat)
          scene.add(mesh)
        } else {
          // Inside equirect: invert X so FrontSide faces inward
          const geo = new THREE.SphereGeometry(500, 128, 96)
          geo.scale(-1, 1, 1)
          tex = await loadTexture(stillUrl, renderer, { sharp: false })
          tex.colorSpace = THREE.SRGBColorSpace
          tex.flipY = true
          const equirectMat = new THREE.MeshBasicMaterial({
            map: tex,
            side: THREE.FrontSide,
            depthWrite: false,
          })
          mesh = new THREE.Mesh(geo, equirectMat)
          scene.add(mesh)
        }

        let yaw = SPHERE.yaw
        let pitch = SPHERE.pitch
        const applyLook = () => {
          const lim = Math.PI / 2 - 0.05
          pitch = Math.max(-lim, Math.min(lim, pitch))
          // yaw π → dir (0,0,-1) = −Z kiosk in host stitch (same as PSV 180°).
          const cp = Math.cos(pitch)
          const dir = new THREE.Vector3(
            Math.sin(yaw) * cp,
            Math.sin(pitch),
            Math.cos(yaw) * cp,
          )
          camera.position.set(0, 0, 0)
          camera.up.set(0, 1, 0)
          camera.lookAt(dir)
        }
        applyLook()

        let userDriving = false
        let ptrId = null
        let lastX = 0
        let lastY = 0
        let lastSharp = false

        function resize() {
          const w = el.clientWidth || 1
          const h = el.clientHeight || 1
          camera.aspect = w / h
          camera.fov = fov
          camera.updateProjectionMatrix()
          // Sharper filtering when zoomed — same texture(s); faces + equirect
          const zoomed = fov < SPHERE.fov * 0.85
          if (zoomed !== lastSharp) {
            if (tex) setTextureZoomSharp(tex, zoomed)
            if (useFaces && mesh?.material?.uniforms) {
              const u = mesh.material.uniforms
              for (const k of ['mapPx', 'mapNx', 'mapPy', 'mapNy', 'mapPz', 'mapNz']) {
                if (u[k]?.value) setTextureZoomSharp(u[k].value, zoomed)
              }
            }
            lastSharp = zoomed
          }
          renderer.setPixelRatio(zoomed ? Math.min(basePr * 2, 3) : basePr)
          renderer.setSize(w, h, false)
        }
        resize()
        const ro = new ResizeObserver(resize)
        ro.observe(el)

        const dom = renderer.domElement
        const onDown = (e) => {
          userDriving = true
          ptrId = e.pointerId
          lastX = e.clientX
          lastY = e.clientY
          try {
            dom.setPointerCapture(e.pointerId)
          } catch {
            /* ignore */
          }
        }
        const onMove = (e) => {
          if (!userDriving || e.pointerId !== ptrId) return
          const dx = e.clientX - lastX
          const dy = e.clientY - lastY
          lastX = e.clientX
          lastY = e.clientY
          const sens = 0.005
          // Drag right → look right (increase yaw); drag up → look up
          yaw += dx * sens
          pitch += dy * sens
          applyLook()
        }
        const onUp = (e) => {
          if (ptrId != null && e.pointerId !== ptrId) return
          userDriving = false
          ptrId = null
        }
        const onWheel = (e) => {
          e.preventDefault()
          // Zoom = FOV only. Eye stays at origin. No texture / capture swap.
          fov = Math.max(SPHERE.minFov, Math.min(SPHERE.maxFov, fov + e.deltaY * 0.04))
          resize()
        }
        dom.addEventListener('pointerdown', onDown)
        dom.addEventListener('pointermove', onMove)
        dom.addEventListener('pointerup', onUp)
        dom.addEventListener('pointercancel', onUp)
        dom.addEventListener('wheel', onWheel, { passive: false })

        let anim = 0
        let lastT = performance.now()
        const tick = (now) => {
          anim = requestAnimationFrame(tick)
          const dt = Math.min(0.05, (now - lastT) / 1000)
          lastT = now
          if (spinEnabled && !userDriving) {
            const radPerSec = (spinRpm * Math.PI * 2) / 60
            yaw += radPerSec * dt
            applyLook()
          }
          camera.position.set(0, 0, 0)
          renderer.render(scene, camera)
        }
        tick(performance.now())

        gallery = {
          renderer,
          scene,
          camera,
          mesh,
          anim,
          ro,
          onDown,
          onUp,
          disposeExtra() {
            dom.removeEventListener('pointermove', onMove)
            dom.removeEventListener('pointercancel', onUp)
            dom.removeEventListener('wheel', onWheel)
          },
        }
        window.__4dpsDemo = {
          dim,
          view,
          ready: true,
          gallery,
          facesReady: useFaces,
          zoomPath,
          upright: true,
          brandLtr: true,
          brandFlipX: false,
          kioskYaw: SPHERE.yaw,
          mode: useFaces ? 'inside-sphere-faces-fov' : 'inside-sphere-equirect-fov',
          spinEnabled,
          spinRpm,
          sphereFit: SPHERE.fit ?? null,
        }
        playAmbient(ASSETS.ambient)
        syncSpinUi()
        const srcTag = useFaces ? 'faces' : stillUrl
        hint.innerHTML = `<strong>${dim.toUpperCase()} · Sphere</strong> · fixed eye · FOV zoom · zoomPath=<code>${zoomPath}</code> · circular crop · <code>${srcTag}</code>`
      }

      async function mountImmersiveFaces() {
        clearViewer()
        el.classList.remove('sphere-stage')

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false })
        const basePr = Math.min(window.devicePixelRatio || 1, 2.5)
        renderer.setPixelRatio(basePr)
        renderer.setClearColor(0x000000, 1)
        renderer.outputColorSpace = THREE.SRGBColorSpace
        el.appendChild(renderer.domElement)

        const scene = new THREE.Scene()
        let fov = 75
        const camera = new THREE.PerspectiveCamera(fov, 1, 0.05, 2000)
        camera.up.set(0, 1, 0)
        camera.position.set(0, 0, 0)

        // Native face sphere — same inside convention as equirect path:
        // FrontSide + scale.x=-1 so brand LTR (BackSide-only mirrors neon).
        const faceTex = await loadFaceTextures(renderer)
        const mat = makeCubeFaceMaterial(faceTex, { inside: false })
        mat.uniforms.flipX.value = 1.0
        const geo = new THREE.SphereGeometry(500, 96, 72)
        geo.scale(-1, 1, 1)
        const mesh = new THREE.Mesh(geo, mat)
        scene.add(mesh)

        // yaw π → −Z kiosk; pitch 0 = level horizon
        let yaw = Math.PI
        let pitch = 0
        const minPitch = -1.15
        const maxPitch = 1.15
        let dragging = false
        let lastX = 0
        let lastY = 0

        function applyLook() {
          pitch = Math.max(minPitch, Math.min(maxPitch, pitch))
          const cp = Math.cos(pitch)
          const dir = new THREE.Vector3(
            Math.sin(yaw) * cp,
            Math.sin(pitch),
            Math.cos(yaw) * cp,
          )
          camera.lookAt(dir)
          camera.up.set(0, 1, 0)
        }
        applyLook()

        let lastSharp = false
        function resize() {
          const w = el.clientWidth || 1
          const h = el.clientHeight || 1
          camera.aspect = w / h
          const zoomed = fov < 55
          // Face maps: disable mips when zoomed so FOV zoom stays sharp (setTextureZoomSharp)
          if (zoomed !== lastSharp) {
            for (const n of Object.keys(faceTex)) setTextureZoomSharp(faceTex[n], zoomed)
            lastSharp = zoomed
          }
          renderer.setPixelRatio(zoomed ? Math.min(basePr * 1.5, 3) : basePr)
          camera.fov = fov
          camera.updateProjectionMatrix()
          renderer.setSize(w, h, false)
        }
        resize()
        const ro = new ResizeObserver(resize)
        ro.observe(el)

        const onDown = (e) => {
          dragging = true
          lastX = e.clientX
          lastY = e.clientY
        }
        const onMove = (e) => {
          if (!dragging) return
          yaw -= (e.clientX - lastX) * 0.005
          pitch += (e.clientY - lastY) * 0.005
          lastX = e.clientX
          lastY = e.clientY
          applyLook()
        }
        const onUp = () => {
          dragging = false
        }
        const onWheel = (e) => {
          e.preventDefault()
          fov = Math.max(
            IMMERSIVE.minFov,
            Math.min(IMMERSIVE.maxFov, fov + e.deltaY * 0.04),
          )
          resize()
        }
        renderer.domElement.addEventListener('pointerdown', onDown)
        window.addEventListener('pointermove', onMove)
        window.addEventListener('pointerup', onUp)
        renderer.domElement.addEventListener('wheel', onWheel, { passive: false })

        let anim = 0
        let idle = 0
        const tick = () => {
          anim = requestAnimationFrame(tick)
          if (!dragging) {
            idle++
            if (idle > 300) {
              yaw += 0.00035
              applyLook()
            }
          } else idle = 0
          renderer.render(scene, camera)
        }
        tick()

        gallery = {
          renderer,
          scene,
          camera,
          mesh,
          faceTex,
          anim,
          ro,
          onDown,
          onUp,
          disposeExtra() {
            window.removeEventListener('pointermove', onMove)
            renderer.domElement.removeEventListener('wheel', onWheel)
          },
        }
        window.__4dpsDemo = {
          dim,
          view,
          ready: true,
          gallery,
          facesReady: true,
          zoomPath: 'faces',
          upright: true,
          kioskYaw: Math.PI,
          pitch: 0,
          mode: 'immersive-faces',
          spinEnabled,
          brandLtr: true,
        }
        playAmbient(ASSETS.ambient)
        syncSpinUi()
        hint.innerHTML =
          '<strong>3D · Immersive</strong> · cube faces · upright horizon · sharp zoom · ambient · <code>/assets/faces/*</code>'
      }

      /** Immersive inside — PSV equirect (or video). Upright horizon. FOV zoom only.
       *  Faces path default ON when cube faces exist (super-res zoom); ?faces=0 to force equirect.
       *  Imagine + render share this path so Source tabs never desync projection.
       */
      async function mountImmersive(url, { isVideo = false } = {}) {
        // Apply mode defaults BEFORE plugins so 4D Immersive never autorotate-autostarts
        syncSpinUi()

        // Native cube faces when available (3D still) — sharp FOV zoom
        if (!isVideo && (await facesAvailable())) {
          try {
            await mountImmersiveFaces()
            syncSpinUi()
            return
          } catch (e) {
            console.warn('immersive faces failed, PSV equirect', e)
          }
        }

        clearViewer()
        el.classList.remove('sphere-stage')

        // One equirect for the session (source still). stillHi only if present & distinct.
        let panorama = url
        let zoomPath = 'equirect'
        const hi = !isVideo ? await stillHiUrl() : null
        if (hi) {
          panorama = hi
          zoomPath = 'hi-equirect'
        }

        // Host still/faces stitch is LTR upright (W2): no still flipX.
        // 4D mp4 may still be pre-LTR-encode mirrored — prefer videoPsv or debug vflip.
        let panoramaSrc = panorama
        let brandFlipX = false
        if (!isVideo) {
          // still equirect already LTR from host stitch; optional ?flipx=1 debug
          if (new URLSearchParams(location.search).get('flipx') === '1') {
            try {
              panoramaSrc = await flipImageUrl(panorama, { flipX: true, flipY: false })
              brandFlipX = true
            } catch (e) {
              console.warn('debug flipX failed', e)
            }
          }
        } else {
          try {
            const isPsvOriented =
              panorama === ASSETS.videoPsv || levels?.psvVideoHflip === true
            if (isPsvOriented) {
              panoramaSrc = panorama
              brandFlipX = true // asset already LTR for PSV
            } else if (
              new URLSearchParams(location.search).get('vflip') === '1' ||
              levels?.needsVideoHflip === true
            ) {
              const flipped = await flipVideoForPsv(panorama)
              window.__4dpsFlipVideo = flipped
              panoramaSrc = flipped
              brandFlipX = true
            } else {
              // Raw equirect.mp4 from older packs is often mirrored in PSV
              // Prefer videoPsv when mount() selected it; else leave as-is
              panoramaSrc = panorama
            }
          } catch (e) {
            console.warn('video orient failed', e)
            panoramaSrc = panorama
          }
        }

        const common = {
          container: el,
          defaultYaw: IMMERSIVE.yaw,
          defaultPitch: IMMERSIVE.pitch,
          sphereCorrection: IMMERSIVE.sphereCorrection,
          fisheye: IMMERSIVE.fisheye,
          maxFov: IMMERSIVE.maxFov,
          minFov: IMMERSIVE.minFov,
          defaultZoomLvl: 0,
          rendererParameters: {
            antialias: true,
            alpha: false,
            preserveDrawingBuffer: false,
          },
        }

        // 4D: spin OFF → huge autostartDelay + stop after ready. Motion lives in VIDEO.
        const autoDelay = spinEnabled ? 1200 : 1e9

        if (isVideo) {
          psv = new Viewer({
            ...common,
            adapter: EquirectangularVideoAdapter,
            panorama: {
              source: panoramaSrc,
              muted: false,
              autoplay: true,
              loop: true,
            },
            navbar: ['video', 'zoom', 'move', 'fullscreen'],
            plugins: [
              VideoPlugin,
              AutorotatePlugin.withConfig({
                autostartDelay: autoDelay,
                autorotateSpeed: `${spinRpm.toFixed(3)}rpm`,
                autorotatePitch: IMMERSIVE.pitch,
              }),
            ],
          })
          {
            const { claim, status } = livingMeta()
            const livingTag = claim
              ? 'living fixed-eye scene video'
              : `status=<code>${status}</code> · livingClaim=false`
            hint.innerHTML =
              `<strong>4D · Immersive</strong> · ${livingTag} · sound · spin <em>off</em> by default · upright · motion in VIDEO`
          }
          playAmbient(ASSETS.ambient)
          zoomPath = 'video'
        } else {
          psv = new Viewer({
            ...common,
            panorama: panoramaSrc,
            navbar: ['zoom', 'move', 'fullscreen'],
            plugins: [
              AutorotatePlugin.withConfig({
                autostartDelay: autoDelay,
                autorotateSpeed: `${spinRpm.toFixed(3)}rpm`,
                autorotatePitch: IMMERSIVE.pitch,
              }),
            ],
          })
          hint.innerHTML =
            '<strong>3D · Immersive</strong> · inside PSV · upright · brand LTR · zoom=<code>' +
            zoomPath +
            '</code> · ambient · <code>' +
            panorama +
            '</code>'
          playAmbient(ASSETS.ambient)
        }

        try {
          psv.addEventListener('zoom-updated', ({ zoomLevel }) => {
            const r = psv.renderer?.renderer
            if (!r) return
            const pr =
              zoomLevel > 40
                ? Math.min((window.devicePixelRatio || 1) * 1.5, 3)
                : Math.min(window.devicePixelRatio || 1, 2)
            r.setPixelRatio(pr)
          })
        } catch {
          /* ignore */
        }

        // Force spin plugin state after mount (never rely on autostart alone)
        syncSpinUi()
        applySpinToPsv()
        // Re-apply after PSV ready (plugin may autostart before our stop)
        try {
          psv.addEventListener('ready', () => {
            applySpinToPsv()
          })
        } catch {
          /* ignore */
        }
        // Safety: stop again shortly after mount if spin should stay off
        if (!spinEnabled) {
          setTimeout(() => applySpinToPsv(), 50)
          setTimeout(() => applySpinToPsv(), 400)
          setTimeout(() => applySpinToPsv(), 1500)
        }

        {
          const { claim, status } = livingMeta()
          window.__4dpsDemo = {
            dim,
            view,
            ready: true,
            psv,
            facesReady: false,
            zoomPath,
            upright: true,
            kioskYaw: Math.PI,
            pitch: 0,
            mode: isVideo ? 'immersive-video' : 'immersive-equirect',
            spinEnabled,
            spinRpm,
            brandFlipX,
            brandLtr: true,
            livingClaim: claim,
            livingStatus: status,
          }
        }

        const flip = new URLSearchParams(location.search).get('flip')
        if (flip === '1' && psv) {
          psv.setOptions({
            sphereCorrection: { pan: 0, tilt: 0, roll: Math.PI },
          })
        }
      }

      async function mount() {
        setChrome()
        const is4d = dim === '4d'
        const hasVideo =
          currentSource?.video &&
          currentSource.video !== currentSource.still &&
          (await assetOk(currentSource.video))
        // Stills: host LTR equirect. 4D Immersive: prefer videoPsv when real video exists.
        let url = is4d && hasVideo ? ASSETS.video : ASSETS.still
        if (is4d && hasVideo && view === 'immersive' && (await assetOk(ASSETS.videoPsv))) {
          url = ASSETS.videoPsv
        }
        if (!(await assetOk(url)) && is4d && hasVideo) {
          url = ASSETS.video
        }
        if (!(await assetOk(url))) {
          clearViewer()
          el.innerHTML = `<div class="err">Missing <code>${url}</code> for source <code>${sourceId}</code>. Capture host pack or drop Imagine equirect into <code>demo/assets/sources/</code>.</div>`
          hint.textContent = 'Asset missing'
          return
        }
        // Resolve spin defaults for this dim×view before any mount (4D spin → off)
        syncSpinUi()
        // 4D: living video on Sphere + Immersive (motion in VIDEO; CSS crop = Sphere framing).
        // 3D: PSV equirect by default (faces only with ?faces=1 — face UV was upside-down live).
        const playVideo = is4d && hasVideo
        const panoramaUrl = playVideo ? url : ASSETS.still
        await mountImmersive(panoramaUrl, { isVideo: playVideo })
        if (view === 'sphere') {
          el.classList.add('sphere-stage')
        } else {
          el.classList.remove('sphere-stage')
        }
        const kindTag =
          currentSource?.kind === 'imagine'
            ? 'Imagine'
            : currentSource?.kind === 'render'
              ? 'Render'
              : 'Source'
        if (window.__4dpsDemo) {
          window.__4dpsDemo.view = view
          const facesOn = window.__4dpsDemo.facesReady === true && window.__4dpsDemo.zoomPath === 'faces'
          if (playVideo) {
            window.__4dpsDemo.mode =
              view === 'sphere' ? 'sphere-video' : 'immersive-video'
            window.__4dpsDemo.zoomPath = 'video'
            window.__4dpsDemo.facesReady = false
          } else if (facesOn) {
            window.__4dpsDemo.mode =
              view === 'sphere' ? 'sphere-faces' : 'immersive-faces'
            // keep zoomPath=faces / facesReady from mountImmersiveFaces
          } else {
            window.__4dpsDemo.mode =
              view === 'sphere' ? 'sphere-psv-equirect' : 'immersive-equirect'
            window.__4dpsDemo.zoomPath = window.__4dpsDemo.zoomPath || 'equirect-fov'
            window.__4dpsDemo.facesReady = false
          }
        }
        if (view === 'sphere') {
          if (is4d) {
            const { claim, status } = livingMeta()
            const liveNote = playVideo
              ? claim
                ? 'living fixed-eye video · spin off'
                : `video surface · livingClaim=false · status=${status}`
              : claim
                ? 'no mp4 — open Immersive when video available'
                : `still ball · livingClaim=false · status=${status}`
            hint.innerHTML =
              `<strong>4D · Sphere · ${kindTag}</strong> · ${playVideo ? 'living video + Gallery crop' : 'still Gallery ball'} · ` +
              `<em>${liveNote}</em> · FOV zoom · <code>${sourceId}</code> · <code>${playVideo ? ASSETS.video : ASSETS.still}</code>`
            if (window.__4dpsDemo) {
              window.__4dpsDemo.fourDSphereNote = playVideo
                ? 'living-video-in-sphere-crop'
                : 'still-ball; live video in Immersive when available'
              window.__4dpsDemo.livingClaim = claim
              window.__4dpsDemo.livingStatus = status
            }
          } else {
            const zp = window.__4dpsDemo?.zoomPath || 'equirect'
            const facesNote = zp === 'faces' ? 'cube faces super-res' : 'PSV equirect'
            hint.innerHTML =
              `<strong>3D · Sphere · ${kindTag}</strong> · fixed eye · FOV zoom · zoomPath=<code>${zp}</code> · ${facesNote} · circular crop · <code>${sourceId}</code>`
          }
        } else if (is4d && !hasVideo) {
          hint.innerHTML =
            `<strong>4D · Immersive · ${kindTag}</strong> · ` +
            `no equirect.mp4 for <code>${sourceId}</code> — showing still · add living video via Imagine or host live capture · <code>${ASSETS.still}</code>`
        }
        // URL chrome without reload
        const u = new URL(location.href)
        u.searchParams.set('dim', dim)
        u.searchParams.set('view', view)
        if (sourceId) u.searchParams.set('source', sourceId)
        history.replaceState(null, '', u)

        if (window.__4dpsDemo) {
          window.__4dpsDemo.sourceId = sourceId
          window.__4dpsDemo.sourceKind = currentSource?.kind || null
          window.__4dpsDemo.sourceLabel = currentSource?.label || null
        }
      }

      dimBtns.forEach((b) =>
        b.addEventListener('click', () => {
          if (b.dataset.dim !== dim) {
            dim = b.dataset.dim
            mount()
          }
        }),
      )
      viewBtns.forEach((b) =>
        b.addEventListener('click', () => {
          if (b.dataset.view !== view) {
            view = b.dataset.view
            mount()
          }
        }),
      )

      // Deep links: ?dim=3d|4d&view=sphere|immersive&source=render-hq|imagine-dream-v1
      // Compat: mode=gallery→3d+sphere, mode=immersive→3d+immersive, mode=4d→4d+immersive
      const params = new URLSearchParams(location.search)
      const mode = params.get('mode')
      if (mode === 'gallery') {
        dim = '3d'
        view = 'sphere'
      } else if (mode === 'immersive') {
        dim = '3d'
        view = 'immersive'
      } else if (mode === '4d') {
        dim = '4d'
        view = 'immersive'
      } else {
        if (params.get('dim') === '4d' || params.get('dim') === '3d') dim = params.get('dim')
        if (params.get('view') === 'sphere' || params.get('view') === 'immersive')
          view = params.get('view')
      }
      const wantSource = params.get('source')

      await loadLevels()
      await loadSources()
      if (wantSource && sourcesCatalog?.sources) {
        const hit = sourcesCatalog.sources.find((s) => s.id === wantSource)
        if (hit) {
          applySource(hit)
          renderSourceTabs()
        }
      }
      mount()
    </script>
  </body>
</html>
