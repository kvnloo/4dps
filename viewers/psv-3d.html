<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>7DPS · 3D Photosphere (Photo Sphere Viewer)</title>
    <link rel="stylesheet" href="/vendor/@photo-sphere-viewer/core/index.css" />
    <style>
      html,
      body,
      #viewer {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #bar {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 10;
        color: #eee;
        font: 13px/1.4 system-ui, sans-serif;
        background: rgba(0, 0, 0, 0.55);
        padding: 8px 12px;
        border-radius: 10px;
        max-width: min(480px, 90vw);
      }
      #bar code {
        color: #9cf;
      }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <div id="bar">
      <strong>7DPS 3D</strong> · Photo Sphere Viewer · drag to look ·
      <code id="src">?panorama=</code>
    </div>
    <script type="module">
      import { Viewer } from '/vendor/@photo-sphere-viewer/core/index.module.js'
      import { AutorotatePlugin } from '/vendor/@photo-sphere-viewer/autorotate-plugin/index.module.js'

      const params = new URLSearchParams(location.search)
      const panorama = params.get('panorama') || params.get('p')
      document.getElementById('src').textContent = panorama || '(missing ?panorama=)'

      if (!panorama) {
        document.getElementById('bar').innerHTML =
          '<strong>7DPS 3D</strong> · pass <code>?panorama=/path/or/url/to/equirect.png</code>'
      } else {
        const viewer = new Viewer({
          container: 'viewer',
          panorama,
          defaultYaw: 0,
          defaultPitch: 0,
          navbar: ['zoom', 'move', 'fullscreen'],
          plugins: [
            AutorotatePlugin.withConfig({
              autostartDelay: 1500,
              autorotateSpeed: '0.5rpm',
            }),
          ],
        })
        window.__7dpsViewer = viewer
      }
    </script>
  </body>
</html>
